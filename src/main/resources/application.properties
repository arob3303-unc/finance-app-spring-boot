spring.application.name=finance-app-idea
# 8080 is taken by a Windows service on this machine.
server.port=8081

# ---------------------------------------------------------------------------
# Database connection (Postgres in Docker - see docker-compose.yml)
# Host port 5332 is mapped to the container's 5432.
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://localhost:5332/finance
spring.datasource.username=finance-app-idea
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

# ---------------------------------------------------------------------------
# Schema ownership: Flyway, not Hibernate.
#
# This used to be ddl-auto=create-drop, which let Hibernate CREATE the tables on
# startup and DROP them on shutdown. That is why the `finance` database was found
# empty: every clean shutdown destroyed the schema and all its rows.
#
# Now Flyway runs the versioned .sql files in db/migration before JPA starts, and
# Hibernate's only job is `validate`: compare the entity classes against the real
# tables and refuse to start if they disagree. That turns a silent runtime mismatch
# into a loud startup failure, which is exactly what you want.
# ---------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ---------------------------------------------------------------------------
# Learning instruments: keep these on. Every request should show you its SQL.
# ---------------------------------------------------------------------------
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Don't keep a Hibernate session open for the whole web request. Leaving this on
# (the default) lets lazy associations load during JSON serialization, which hides
# N+1 query problems until production. Off means lazy-loading mistakes fail loudly.
spring.jpa.open-in-view=false
